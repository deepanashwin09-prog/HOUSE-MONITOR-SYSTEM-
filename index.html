<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Monitor System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏠 HOUSE MONITOR SYSTEM</h1>
        <p>Smart Home Dashboard</p>
    </header>

    <main class="dashboard">

        <!-- ESP32 STATUS -->
        <div class="card">
            <h2>📡 ESP32</h2>

            <div class="device-status">
                <span id="espIndicator" class="indicator online"></span>
                <span id="espStatus">ONLINE</span>
            </div>

            <p id="lastUpdate">Last update: Just now</p>
        </div>


        <!-- TEMPERATURE -->
        <div class="card">
            <h2>🌡️ Temperature</h2>
            <p class="value">28°C</p>
        </div>


        <!-- HUMIDITY -->
        <div class="card">
            <h2>💧 Humidity</h2>
            <p class="value">65%</p>
        </div>


        <!-- RAIN -->
        <div class="card">
            <h2>🌧️ Rain Status</h2>
            <p class="status">No Rain</p>
        </div>


        <!-- LED LIGHT -->
        <div class="card">
            <h2>💡 LED LIGHT</h2>

            <p id="ledStatus" class="status">OFF</p>

            <button id="ledButton" onclick="toggleLED()">TURN ON</button>
        </div>


        <!-- MOTION -->
        <div class="card">
            <h2>🚶 Motion</h2>
            <p class="status">No Motion</p>
        </div>

    </main>


    <footer>
        <p>HOUSE MONITOR SYSTEM © 2026</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
